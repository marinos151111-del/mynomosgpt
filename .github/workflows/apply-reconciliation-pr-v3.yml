name: Apply final corrected specialist reconciliation

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/reconcile-pr-trigger/**

permissions:
  contents: write

jobs:
  apply-final:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Execute and normalize reconciliation patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/reconcile-specialist-fields.yml').read_text(encoding='utf-8')
          marker = "python - <<'PY'\n"
          if marker not in workflow:
              raise SystemExit('Embedded reconciliation script not found')
          embedded = textwrap.dedent(workflow.split(marker, 1)[1].split('\n          PY', 1)[0])
          exec(compile(embedded, 'reconciliation_patch.py', 'exec'))

          agents_path = Path('src/nomologies-v2/agents.ts')
          agents = agents_path.read_text(encoding='utf-8')
          agents = agents.replace('  type EvidenceAnchorV2,', '  EvidenceAnchorV2,')
          agents = agents.replace('  type GroundOrIssueV2,', '  GroundOrIssueV2,')
          agents = agents.replace('  type OutcomeComponentV2,', '  OutcomeComponentV2,')
          agents_path.write_text(agents, encoding='utf-8')
          PY

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check patched pipeline
        run: deno check scripts/run-test.ts

      - name: Commit reconciliation changes to main
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/reconcile-trigger
          rm -f .github/workflows/reconcile-specialist-fields.yml .github/workflows/apply-reconciliation.yml .github/workflows/apply-reconciliation-pr.yml .github/workflows/apply-reconciliation-pr-v2.yml .github/workflows/apply-reconciliation-pr-v3.yml
          git config user.name "Nomologies V2 Reconciliation Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Reconcile specialist extraction fields"
          git push origin HEAD:main
