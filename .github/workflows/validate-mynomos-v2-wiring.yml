name: Validate MyNomos V2 frontend wiring

on:
  push:
    branches:
      - agent/supabase-global-backend
    paths:
      - .github/workflows/validate-mynomos-v2-wiring.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Clone wired MyNomos branch
        run: git clone --depth 1 --branch agent/nomologies-v2-supabase-wiring https://github.com/marinos151111-del/MyNomosAI.git app
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build wired frontend
        working-directory: app
        run: |
          npm ci
          npm run build
