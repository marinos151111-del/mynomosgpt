name: Apply adopted-authority refinement

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-adopted-refinement.yml
      - scripts/refine-adopted-authority.py

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/legal-quality-hardening
          fetch-depth: 0

      - name: Apply reviewed refinement
        run: python scripts/refine-adopted-authority.py

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check refined pipeline
        run: deno task check

      - name: Commit validated refinement
        run: |
          rm -f scripts/refine-adopted-authority.py
          rm -f .github/workflows/apply-adopted-refinement.yml
          git config user.name 'Nomologies V2 Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Refine adopted authority boundaries'
          git push origin HEAD:agent/legal-quality-hardening
