name: Regression E5 legal quality

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/regression-e5-legal-quality.yml
      - src/nomologies-v2/**
      - web/**
      - server.ts
      - scripts/run-test.ts

permissions:
  contents: read

jobs:
  full-extraction:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/legal-quality-hardening

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check pipeline
        run: deno task check

      - name: Run real E5/2025 full extraction
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NOMOLOGIES_V2_MODEL: gpt-5.4-mini
          PIPELINE_MODE: full
          SOURCE_URL: https://www.cylaw.org/cgi-bin/open.pl?file=/courtOfAppeal/2026/202607-E5-25PolEfAit270426.html
        run: deno task test

      - name: Print legal-quality diagnostic
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('artifacts/nomologies-v2/nomologies-v2-result.json').read_text(encoding='utf-8'))
          record = result['record']
          instruments = record['authorities']['legislation']['value']
          authorities = record['authorities']['authorities']['value']
          diagnostic = {
              'caseNumber': record['identity']['caseNumber']['value'],
              'primaryLegalArea': record['classification']['primaryLegalArea'],
              'proceedingType': record['classification']['proceedingType'],
              'proceduralPosture': record['classification']['proceduralPosture'],
              'overallOutcome': record['outcome']['overallOutcome'],
              'relief': record['procedure']['reliefSought'],
              'grounds': record['procedure']['groundsOrIssues']['value'],
              'components': record['outcome']['components'],
              'legalPrinciple': record['analysis']['legalPrincipleSummary']['value'],
              'instruments': instruments,
              'authorityContexts': sorted({item.get('citationContext', 'missing') for item in authorities}),
              'conflicts': record['conflicts'],
              'readiness': record['readinessScore'],
          }
          print(json.dumps(diagnostic, ensure_ascii=False, indent=2))
          Path('artifacts/nomologies-v2/legal-quality-diagnostic.json').write_text(
              json.dumps(diagnostic, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          PY

      - name: Assert legal-quality corrections
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('artifacts/nomologies-v2/nomologies-v2-result.json').read_text(encoding='utf-8'))
          assert result['mode'] == 'full'
          record = result['record']
          case_number = record['identity']['caseNumber']['value'].strip().replace('E', 'Ε')
          assert case_number == 'Ε5/2025', case_number
          assert record['classification']['primaryLegalArea']['value'] == 'civil_procedure'
          assert record['classification']['proceedingType']['value'] == 'expedition_application'
          assert record['classification']['proceduralPosture']['value'] == 'interim_stage'
          assert record['outcome']['overallOutcome']['value'] == 'application_dismissed'
          assert record['procedure']['reliefSought']['value'][0]['status'] == 'refused'
          assert all(not item.get('number') for item in record['procedure']['groundsOrIssues']['value'])
          assert record['outcome']['components']['status'] == 'unavailable'
          assert "κατ' εξαίρεση" not in record['analysis']['legalPrincipleSummary']['value'].lower()

          instruments = record['authorities']['legislation']['value']
          cpr = next(item for item in instruments if '41.4' in json.dumps(item, ensure_ascii=False))
          article32 = next(item for item in instruments if '14/60' in json.dumps(item, ensure_ascii=False))
          assert cpr['primary'] is True
          assert article32['primary'] is False

          contexts = {item['citationContext'] for item in record['authorities']['authorities']['value']}
          assert 'direct' in contexts
          assert 'adopted_quotation' in contexts
          assert 'nested_quotation' in contexts

          conflicts = record['conflicts']
          assert not any(item['code'] == 'ATTRIBUTION_VALIDATION_FAILED' for item in conflicts)
          assert not any(item['severity'] == 'critical' for item in conflicts)
          assert any(item['code'] == 'SOURCE_DATE_CONFLICT' for item in conflicts)
          assert record['readinessScore'] >= 70, record['readinessScore']
          PY

      - name: Upload reviewed regression artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nomologies-e5-legal-quality
          path: artifacts/nomologies-v2/
          retention-days: 7
