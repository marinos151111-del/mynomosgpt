name: Finalize elite search query mode

on:
  pull_request:
    paths:
      - .github/workflows/finalize-search-query-mode.yml
      - src/nomologies-search/**

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'agent/lexis-search-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lexis-search-v1
          fetch-depth: 0
      - name: Use soft natural-language query mode everywhere
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          replacements = {
            Path('src/nomologies-search/engine.ts'): [
              ('from "./query.ts";', 'from "./query-elite.ts";'),
            ],
            Path('src/nomologies-search/search.test.ts'): [
              ('from "./query.ts";', 'from "./query-elite.ts";'),
              (
                'assert(parsed.expandedTerms.some((term) => term.includes("επίσπευση")), "Greeklish should expand to Greek concept");',
                'assert(parsed.expandedTerms.some((term) => normalizeLegalText(term).includes(normalizeLegalText("επίσπευση"))), "Greeklish should expand to Greek concept");'
              ),
            ],
          }

          for path, rows in replacements.items():
            text = path.read_text(encoding='utf-8')
            for old, new in rows:
              text = text.replace(old, new, 1)
            path.write_text(text, encoding='utf-8')
          PY
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Validate complete elite search
        run: |
          deno task check
          deno task test:search
      - name: Commit validated query mode
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No query-mode changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/nomologies-search/engine.ts src/nomologies-search/search.test.ts
          git commit -m "Use soft legal query interpretation"
          git push origin HEAD:agent/lexis-search-v1
