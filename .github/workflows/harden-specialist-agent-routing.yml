name: Harden specialist agent routing

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/harden-specialist-agent-routing.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restrict each specialist to admissible sections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          agents_path = Path('src/nomologies-v2/agents.ts')
          agents = agents_path.read_text(encoding='utf-8')
          replacements = {
            'sectionPayload(source, sectionMap, FACT_PROCEDURE_TYPES, "all")': 'sectionPayload(source, sectionMap, FACT_PROCEDURE_TYPES, "none")',
            'sectionPayload(source, sectionMap, ANALYSIS_TYPES, "all")': 'sectionPayload(source, sectionMap, ANALYSIS_TYPES, "none")',
            'sectionPayload(source, sectionMap, OUTCOME_TYPES, "tail")': 'sectionPayload(source, sectionMap, OUTCOME_TYPES, "none")',
            'runAgent("judicial-analysis", NOMOLOGIES_SCHEMAS.analysis, ANALYSIS_SYSTEM_PROMPT, analysisUser, "high", options)': 'runAgent("judicial-analysis", NOMOLOGIES_SCHEMAS.analysis, ANALYSIS_SYSTEM_PROMPT, analysisUser, "medium", options)',
            'runAgent("outcome-orders", NOMOLOGIES_SCHEMAS.outcome, OUTCOME_SYSTEM_PROMPT, outcomeUser, "high", options)': 'runAgent("outcome-orders", NOMOLOGIES_SCHEMAS.outcome, OUTCOME_SYSTEM_PROMPT, outcomeUser, "medium", options)',
            'timeoutMs: 185_000,': 'timeoutMs: 240_000,',
          }
          for old, new in replacements.items():
              if old not in agents:
                  raise SystemExit(f'Agent routing anchor not found: {old}')
              agents = agents.replace(old, new, 1)
          agents_path.write_text(agents, encoding='utf-8')

          pipeline_path = Path('src/nomologies-v2/pipeline.ts')
          pipeline = pipeline_path.read_text(encoding='utf-8')
          if 'effort: "high",' not in pipeline or 'timeoutMs: 190_000,' not in pipeline:
              raise SystemExit('Reviewer tuning anchors not found')
          pipeline = pipeline.replace('effort: "high",', 'effort: "medium",', 1)
          pipeline = pipeline.replace('timeoutMs: 190_000,', 'timeoutMs: 240_000,', 1)
          pipeline_path.write_text(pipeline, encoding='utf-8')

          prompts_path = Path('src/nomologies-v2/prompts.ts')
          prompts = prompts_path.read_text(encoding='utf-8')
          analysis_anchor = '''- legalPrincipleSummary is a concise Greek synthesis of the verified ratio, not
            a topic label and not a quotation dump.'''
          analysis_replacement = '''- legalPrincipleSummary is a concise Greek synthesis of the verified ratio, not
            a topic label and not a quotation dump.
          - Be selective: return only legally material issues, findings and principles;
            do not repeat the same proposition across multiple fields.'''
          if analysis_anchor not in prompts:
              raise SystemExit('Analysis prompt anchor not found')
          prompts_path.write_text(prompts.replace(analysis_anchor, analysis_replacement, 1), encoding='utf-8')
          PY

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check hardened pipeline
        run: deno check scripts/run-test.ts

      - name: Commit specialist routing hardening
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/harden-specialist-agent-routing.yml
          git config user.name "Nomologies V2 Agent Router"
          git config user.email "actions@users.noreply.github.com"
          git add src/nomologies-v2/agents.ts src/nomologies-v2/pipeline.ts src/nomologies-v2/prompts.ts .github/workflows/harden-specialist-agent-routing.yml
          git commit -m "Restrict specialist agent contexts"
          git push origin HEAD:main
