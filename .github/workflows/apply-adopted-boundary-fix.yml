name: Apply adopted-authority boundary fix

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-adopted-boundary-fix.yml
      - scripts/fix-adopted-authority-boundary.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/legal-quality-hardening
          fetch-depth: 0

      - name: Apply reviewed boundary fix
        run: python scripts/fix-adopted-authority-boundary.py

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check pipeline
        run: deno task check

      - name: Commit validated boundary fix
        run: |
          rm -f scripts/fix-adopted-authority-boundary.py
          rm -f .github/workflows/apply-adopted-boundary-fix.yml
          git config user.name 'Nomologies V2 Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Fix adopted authority section boundary'
          git push origin HEAD:agent/legal-quality-hardening
