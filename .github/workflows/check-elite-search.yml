name: Check elite Nomologies search

on:
  push:
    branches:
      - agent/lexis-search-v1
    paths:
      - src/nomologies-search/**
      - deno.json
      - server.ts
      - web/search.html
      - web/search.js
      - web/index.html
      - .github/workflows/check-elite-search.yml
  pull_request:
    paths:
      - src/nomologies-search/**
      - deno.json
      - server.ts
      - web/search.html
      - web/search.js
      - web/index.html

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check complete pipeline and search
        run: deno task check
      - name: Run elite search regression suite
        run: deno task test:search
