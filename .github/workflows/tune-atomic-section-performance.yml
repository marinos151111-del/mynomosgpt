name: Tune atomic section mapping performance

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tune-atomic-section-performance.yml

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Split atomic mapping into bounded concurrent windows
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          sections_path = Path('src/nomologies-v2/sections.ts')
          text = sections_path.read_text(encoding='utf-8')
          old = '''const WINDOW_TARGET_CHARS = 105_000;
          const WINDOW_OVERLAP_TARGET_CHARS = 18_000;
          const MAX_WINDOW_OVERLAP_PARAGRAPHS = 14;
          const MIN_WINDOW_ADVANCE_PARAGRAPHS = 4;
          const MAX_SECTION_WINDOWS = 64;
          const MAX_CONCURRENCY = 3;'''
          new = '''const WINDOW_TARGET_CHARS = 5_500;
          const WINDOW_OVERLAP_TARGET_CHARS = 900;
          const MAX_WINDOW_OVERLAP_PARAGRAPHS = 8;
          const MIN_WINDOW_ADVANCE_PARAGRAPHS = 12;
          const MAX_SECTION_WINDOWS = 64;
          const MAX_CONCURRENCY = 4;'''
          if old not in text:
              raise SystemExit('Atomic window tuning block not found')
          text = text.replace(old, new, 1)
          text = text.replace('      effort: "medium",', '      effort: "low",', 1)
          text = text.replace('      timeoutMs: 170_000,', '      timeoutMs: 120_000,', 1)
          sections_path.write_text(text, encoding='utf-8')

          prompts_path = Path('src/nomologies-v2/prompts.ts')
          prompts = prompts_path.read_text(encoding='utf-8')
          old_prompt = '''Return spans in document order. Use first and last passage IDs exactly as supplied.
          Boundary evidence must identify passages that justify the start or end of each span.`;'''
          new_prompt = '''Return spans in document order. Use first and last passage IDs exactly as supplied.
          Boundary evidence must identify passages that justify the start or end of each span.
          Keep each heading concise and each rationale to one short sentence. Merge adjacent
          passages only when section type, speaker, quotation status and legal function match.`;'''
          if old_prompt not in prompts:
              raise SystemExit('Section prompt ending not found')
          prompts_path.write_text(prompts.replace(old_prompt, new_prompt, 1), encoding='utf-8')
          PY

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check tuned pipeline
        run: deno check scripts/run-test.ts

      - name: Commit performance tuning
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tune-atomic-section-performance.yml
          git config user.name "Nomologies V2 Performance Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/nomologies-v2/sections.ts src/nomologies-v2/prompts.ts .github/workflows/tune-atomic-section-performance.yml
          git commit -m "Bound atomic section windows"
          git push origin HEAD:main
