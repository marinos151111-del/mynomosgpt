name: Apply specialist reconciliation from PR trigger

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/reconcile-pr-trigger/**

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Execute reviewed reconciliation patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/reconcile-specialist-fields.yml').read_text(encoding='utf-8')
          marker = "python - <<'PY'\n"
          if marker not in workflow:
              raise SystemExit('Embedded reconciliation script not found')
          embedded = workflow.split(marker, 1)[1].split('\n          PY', 1)[0]
          exec(compile(textwrap.dedent(embedded), 'reconciliation_patch.py', 'exec'))
          PY

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check patched pipeline
        run: deno check scripts/run-test.ts

      - name: Commit reconciliation changes to main
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/reconcile-trigger
          rm -f .github/workflows/reconcile-specialist-fields.yml .github/workflows/apply-reconciliation.yml .github/workflows/apply-reconciliation-pr.yml
          git config user.name "Nomologies V2 Reconciliation Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Reconcile specialist extraction fields"
          git push origin HEAD:main
