name: Fix elite search regressions

on:
  pull_request:
    paths:
      - .github/workflows/fix-search-regressions.yml
      - src/nomologies-search/**

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/lexis-search-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lexis-search-v1
          fetch-depth: 0
      - name: Apply soft-filter and normalized Greeklish fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          engine = Path('src/nomologies-search/engine.ts')
          text = engine.read_text(encoding='utf-8')
          text = text.replace('from "./query.ts";', 'from "./query-elite.ts";', 1)
          engine.write_text(text, encoding='utf-8')

          test = Path('src/nomologies-search/search.test.ts')
          text = test.read_text(encoding='utf-8')
          text = text.replace(
              'assert(parsed.expandedTerms.some((term) => term.includes("επίσπευση")), "Greeklish should expand to Greek concept");',
              'assert(parsed.expandedTerms.some((term) => normalizeLegalText(term).includes(normalizeLegalText("επίσπευση"))), "Greeklish should expand to Greek concept");'
          )
          test.write_text(text, encoding='utf-8')
          PY
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Validate fixes
        run: |
          deno task check
          deno task test:search
      - name: Commit validated fixes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No regression fixes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/nomologies-search/engine.ts src/nomologies-search/search.test.ts
          git commit -m "Fix elite search regressions"
          git push origin HEAD:agent/lexis-search-v1
