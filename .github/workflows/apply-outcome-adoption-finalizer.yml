name: Apply deterministic outcome and adoption finalizer

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-outcome-adoption-finalizer.yml
      - scripts/finalize-outcome-and-adoption.py

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/legal-quality-hardening
          fetch-depth: 0

      - name: Apply reviewed deterministic finalizer
        run: python scripts/finalize-outcome-and-adoption.py

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check pipeline
        run: deno task check

      - name: Commit validated finalizer
        run: |
          rm -f scripts/finalize-outcome-and-adoption.py
          rm -f .github/workflows/apply-outcome-adoption-finalizer.yml
          git config user.name 'Nomologies V2 Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Normalize application outcome and adopted authority'
          git push origin HEAD:agent/legal-quality-hardening
