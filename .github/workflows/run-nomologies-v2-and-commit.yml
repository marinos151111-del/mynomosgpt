name: Run Nomologies V2 benchmark and publish report

on:
  push:
    branches:
      - main
    paths:
      - .github/run-requests/**

permissions:
  contents: write

concurrency:
  group: nomologies-v2-observable-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout isolated repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Use Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check isolated pipeline
        run: deno check scripts/run-test.ts

      - name: Confirm repository-local OpenAI secret
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${OPENAI_API_KEY:-}" || { echo 'OPENAI_API_KEY is missing from marinos151111-del/mynomosgpt.' >&2; exit 1; }

      - name: Run first section-recognition benchmark
        id: extraction
        continue-on-error: true
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SOURCE_URL: https://www.cylaw.org/cgi-bin/open.pl?file=/supreme/2026/202601-30-16PolEf.html
          PIPELINE_MODE: sections
          NOMOLOGIES_V2_MODEL: gpt-5.4-mini
        run: |
          set +e
          deno run \
            --allow-net=api.openai.com,cylaw.org,www.cylaw.org \
            --allow-env=OPENAI_API_KEY,NOMOLOGIES_V2_MODEL,SOURCE_URL,PIPELINE_MODE \
            --allow-read \
            --allow-write=artifacts \
            scripts/run-test.ts
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish sanitized benchmark report to repository
        shell: bash
        env:
          EXIT_CODE: ${{ steps.extraction.outputs.exit_code }}
        run: |
          set -euo pipefail
          rm -rf reports/latest
          mkdir -p reports/latest
          if [ -d artifacts/nomologies-v2 ]; then
            cp -R artifacts/nomologies-v2/. reports/latest/
          fi
          cat > reports/latest/run.json <<EOF
          {
            "sourceUrl": "https://www.cylaw.org/cgi-bin/open.pl?file=/supreme/2026/202601-30-16PolEf.html",
            "mode": "sections",
            "model": "gpt-5.4-mini",
            "exitCode": ${EXIT_CODE:-99},
            "workflowCommit": "${GITHUB_SHA}",
            "generatedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          git config user.name "Nomologies V2 Benchmark Bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/latest
          git commit -m "Publish latest Nomologies V2 benchmark report"
          git push origin HEAD:main
