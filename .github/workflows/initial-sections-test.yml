name: Initial Nomologies V2 sections test

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
    paths:
      - .github/initial-sections-test

permissions:
  contents: read

jobs:
  sections-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check isolated pipeline
        run: deno check scripts/run-test.ts

      - name: Confirm OpenAI secret is stored in this repository
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          test -n "${OPENAI_API_KEY:-}" || { echo 'OPENAI_API_KEY is missing from marinos151111-del/mynomosgpt.' >&2; exit 1; }

      - name: Run section recognition on the first benchmark judgment
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SOURCE_URL: https://www.cylaw.org/cgi-bin/open.pl?file=/supreme/2026/202601-30-16PolEf.html
          PIPELINE_MODE: sections
          NOMOLOGIES_V2_MODEL: ""
        run: |
          deno run \
            --allow-net=api.openai.com,cylaw.org,www.cylaw.org \
            --allow-env=OPENAI_API_KEY,NOMOLOGIES_V2_MODEL,SOURCE_URL,PIPELINE_MODE \
            --allow-read \
            --allow-write=artifacts \
            scripts/run-test.ts

      - name: Publish report summary
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/nomologies-v2/summary.md ]; then
            cat artifacts/nomologies-v2/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload HTML and JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: initial-nomologies-v2-sections-report
          path: artifacts/nomologies-v2
          if-no-files-found: warn
          retention-days: 30
