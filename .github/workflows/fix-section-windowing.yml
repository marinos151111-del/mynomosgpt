name: Patch adaptive section window overlap

on:
  push:
    branches:
      - agent/test-initial-sections
    paths:
      - .github/workflows/fix-section-windowing.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout benchmark branch
        uses: actions/checkout@v4
        with:
          ref: agent/test-initial-sections
          fetch-depth: 0

      - name: Patch pathological overlap calculation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/nomologies-v2/sections.ts')
          text = path.read_text(encoding='utf-8')

          old_constants = '''const WINDOW_TARGET_CHARS = 105_000;
          const WINDOW_OVERLAP_PARAGRAPHS = 14;
          const MAX_SECTION_WINDOWS = 24;
          const MAX_CONCURRENCY = 3;'''
          new_constants = '''const WINDOW_TARGET_CHARS = 105_000;
          const WINDOW_OVERLAP_TARGET_CHARS = 18_000;
          const MAX_WINDOW_OVERLAP_PARAGRAPHS = 14;
          const MIN_WINDOW_ADVANCE_PARAGRAPHS = 4;
          const MAX_SECTION_WINDOWS = 64;
          const MAX_CONCURRENCY = 3;'''

          old_next = '''    const next = Math.max(start + 1, end - WINDOW_OVERLAP_PARAGRAPHS);
              start = next;'''
          new_next = '''    let overlapStart = end;
              let overlapCharacters = 0;
              let overlapParagraphs = 0;
              while (
                overlapStart > start &&
                overlapParagraphs < MAX_WINDOW_OVERLAP_PARAGRAPHS &&
                overlapCharacters < WINDOW_OVERLAP_TARGET_CHARS
              ) {
                overlapStart -= 1;
                overlapCharacters += paragraphs[overlapStart].text.length + 120;
                overlapParagraphs += 1;
              }

              // A fixed 14-paragraph overlap could consume almost an entire window
              // when CyLaw paragraphs are long, advancing only one paragraph per API
              // call. Preserve useful context while guaranteeing material progress.
              const minimumNext = Math.min(end, start + MIN_WINDOW_ADVANCE_PARAGRAPHS);
              const next = Math.max(minimumNext, overlapStart);
              if (next <= start) throw new Error("SECTION_WINDOW_PROGRESS_STALLED");
              start = next;'''

          if old_constants not in text:
              raise SystemExit('Constant block not found; refusing blind patch')
          if old_next not in text:
              raise SystemExit('Window advance block not found; refusing blind patch')

          text = text.replace(old_constants, new_constants, 1)
          text = text.replace(old_next, new_next, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Type-check patched pipeline
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Validate patched graph
        run: deno check scripts/run-test.ts

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-section-windowing.yml
          git config user.name "Nomologies V2 Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/nomologies-v2/sections.ts .github/workflows/fix-section-windowing.yml
          git commit -m "Fix adaptive section window overlap"
          git push origin HEAD:agent/test-initial-sections
