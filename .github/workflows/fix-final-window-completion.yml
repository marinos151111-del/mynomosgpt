name: Fix final section window completion

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-final-window-completion.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Mark final window as complete
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src/nomologies-v2/sections.ts')
          text = path.read_text(encoding='utf-8')
          old = '    if (end >= paragraphs.length) break;'
          new = '''    if (end >= paragraphs.length) {
              start = paragraphs.length;
              break;
            }'''
          if old not in text:
              raise SystemExit('Final-window guard not found; refusing blind patch')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check corrected pipeline
        run: deno check scripts/run-test.ts

      - name: Commit correction
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-final-window-completion.yml
          git config user.name "Nomologies V2 Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/nomologies-v2/sections.ts .github/workflows/fix-final-window-completion.yml
          git commit -m "Mark final section window as complete"
          git push origin HEAD:main
