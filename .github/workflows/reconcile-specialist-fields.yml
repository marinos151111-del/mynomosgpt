name: Reconcile specialist extraction fields

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/reconcile-specialist-fields.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Tighten field evidence policies and deterministic reconciliation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          # ── Evidence policies ──────────────────────────────────────────────
          evidence_path = Path('src/nomologies-v2/evidence.ts')
          evidence = evidence_path.read_text(encoding='utf-8')

          policy_anchor = '''const FACT_SECTIONS = new Set<SectionType>([
            "facts", "witness_evidence", "documentary_evidence", "findings_of_fact",
            "procedural_history", "court_analysis",
          ]);'''
          policy_replacement = '''const FACT_SECTIONS = new Set<SectionType>([
            "facts", "witness_evidence", "documentary_evidence", "findings_of_fact",
            "procedural_history", "court_analysis",
          ]);
          const FACT_NARRATIVE_SECTIONS = new Set<SectionType>([
            "facts", "findings_of_fact", "procedural_history",
          ]);
          const WITNESS_EVIDENCE_SECTIONS = new Set<SectionType>([
            "facts", "witness_evidence", "documentary_evidence", "findings_of_fact",
            "procedural_history", "court_analysis", "legal_findings",
          ]);
          const PROCEDURAL_HISTORY_SECTIONS = new Set<SectionType>([
            "case_metadata", "facts", "procedural_history", "court_analysis", "legal_findings", "holding",
          ]);
          const ORIGINATING_PROCEEDING_SECTIONS = new Set<SectionType>([
            "caption", "facts", "procedural_history",
          ]);
          const LOWER_COURT_DECISION_SECTIONS = new Set<SectionType>([
            "facts", "procedural_history", "court_analysis", "legal_findings",
          ]);
          const GROUNDS_SECTIONS = new Set<SectionType>([
            "appellant_submissions", "respondent_submissions", "applicant_submissions",
            "respondent_public_body_submissions", "prosecution_submissions",
            "defence_submissions", "other_party_submissions", "court_analysis", "legal_findings", "holding",
          ]);
          const RELIEF_SECTIONS = new Set<SectionType>([
            "caption", "facts", "procedural_history", "appellant_submissions",
            "respondent_submissions", "applicant_submissions", "respondent_public_body_submissions",
            "prosecution_submissions", "defence_submissions", "other_party_submissions",
          ]);'''
          if policy_anchor not in evidence:
              raise SystemExit('Evidence policy anchor not found')
          evidence = evidence.replace(policy_anchor, policy_replacement, 1)

          old_policy_branches = '''  if (path.startsWith("facts.")) {
              return { allowedSections: FACT_SECTIONS, allowQuotedMaterial: false, minimumQuoteLength: 12 };
            }
            if (path === "procedure.submissionsByParty") {
              return { allowedSections: SUBMISSION_SECTIONS, allowQuotedMaterial: false, minimumQuoteLength: 12 };
            }
            if (path.startsWith("procedure.")) {
              return { allowedSections: PROCEDURE_SECTIONS, allowQuotedMaterial: false, minimumQuoteLength: 8 };
            }'''
          new_policy_branches = '''  if (["facts.summary", "facts.materialFacts", "facts.chronology", "facts.undisputedFacts", "facts.disputedFacts"].includes(path)) {
              return { allowedSections: FACT_NARRATIVE_SECTIONS, allowQuotedMaterial: false, minimumQuoteLength: 12 };
            }
            if (path === "facts.witnessesAndEvidence") {
              return { allowedSections: WITNESS_EVIDENCE_SECTIONS, allowQuotedMaterial: false, minimumQuoteLength: 12 };
            }
            if (path.startsWith("facts.")) {
              return { allowedSections: FACT_SECTIONS, allowQuotedMaterial: false, minimumQuoteLength: 12 };
            }
            if (path === "procedure.submissionsByParty") {
              return { allowedSections: SUBMISSION_SECTIONS, allowQuotedMaterial: false, minimumQuoteLength: 12 };
            }
            if (path === "procedure.proceduralHistory") {
              return { allowedSections: PROCEDURAL_HISTORY_SECTIONS, allowQuotedMaterial: false, minimumQuoteLength: 8 };
            }
            if (path === "procedure.originatingProceeding") {
              return { allowedSections: ORIGINATING_PROCEEDING_SECTIONS, allowQuotedMaterial: false, minimumQuoteLength: 8 };
            }
            if (path === "procedure.lowerCourtDecision") {
              return { allowedSections: LOWER_COURT_DECISION_SECTIONS, allowQuotedMaterial: false, minimumQuoteLength: 8 };
            }
            if (path === "procedure.groundsOrIssues") {
              return { allowedSections: GROUNDS_SECTIONS, allowQuotedMaterial: false, minimumQuoteLength: 8 };
            }
            if (path === "procedure.reliefSought") {
              return { allowedSections: RELIEF_SECTIONS, allowQuotedMaterial: false, minimumQuoteLength: 8 };
            }
            if (path.startsWith("procedure.")) {
              return { allowedSections: PROCEDURE_SECTIONS, allowQuotedMaterial: false, minimumQuoteLength: 8 };
            }'''
          if old_policy_branches not in evidence:
              raise SystemExit('Evidence policy branches not found')
          evidence_path.write_text(evidence.replace(old_policy_branches, new_policy_branches, 1), encoding='utf-8')

          # ── Prompts ────────────────────────────────────────────────────────
          prompts_path = Path('src/nomologies-v2/prompts.ts')
          prompts = prompts_path.read_text(encoding='utf-8')

          old_facts = '''SOURCE DISCIPLINE
          - Facts may come from facts, witness_evidence, documentary_evidence and findings
            sections. Mark disputed and undisputed facts separately.
          - A party's allegation remains a submission unless the court adopts it.
          - Procedural history must describe the route to this judgment, including the
            lower court/decision where stated.
          - groundsOrIssues should preserve numbering and the result of each ground only
            where the present court determined it.
          - submissionsByParty must remain attributed to the correct party and must never
            be transformed into the court's holding.'''
          new_facts = '''SOURCE DISCIPLINE
          - facts.summary contains factual background only. It must not state the present
            appeal/application outcome, the court's legal conclusion, ratio or final order.
          - Facts may come from facts, witness_evidence, documentary_evidence and findings
            sections. Mark disputed and undisputed facts separately.
          - A party's allegation remains a submission unless the court adopts it.
          - proceduralHistory describes the route to this judgment and the earlier result;
            keep the present judgment's final disposition exclusively in outcome.
          - originatingProceeding may be evidenced by factual narrative that identifies the
            claim, petition, recourse or application which began the litigation.
          - lowerCourtDecision must preserve every cumulative limb of the earlier order.
            Different beneficiaries or objects are not a contradiction when one limb cancels
            or transfers a share and another registers a separately described part. Mark
            conflicted only where the same legal object is ordered incompatibly.
          - groundsOrIssues must preserve every numbered ground and its result whenever the
            present court expressly determines it.
          - submissionsByParty must remain attributed to the correct party and must never
            be transformed into the court's holding.'''
          if old_facts not in prompts:
              raise SystemExit('Facts prompt anchor not found')
          prompts = prompts.replace(old_facts, new_facts, 1)

          old_analysis = '''- holding resolves the concrete issue. ratioDecidendi states the general legal
            proposition necessary for the outcome and explains its application to facts.
          - legalPrincipleSummary is a concise Greek synthesis of the verified ratio, not
            a topic label and not a quotation dump.'''
          new_analysis = '''- holding resolves the concrete issues and grounds determined by the present court.
            When explicit issue-level conclusions exist (for example «ο λόγος έφεσης 1
            απορρίπτεται»), synthesize all of them; do not use the overall disposition as
            the sole holding. The final disposition belongs in outcome.
          - dominantIssue must be framed from the court's legal analysis, never supported
            solely by the final disposition.
          - ratioDecidendi states the general legal proposition necessary for the outcome
            and explains its application to facts.
          - legalPrincipleSummary is a concise Greek synthesis of the verified ratio, not
            a topic label and not a quotation dump.'''
          if old_analysis not in prompts:
              raise SystemExit('Analysis prompt anchor not found')
          prompts = prompts.replace(old_analysis, new_analysis, 1)

          old_outcome = '''- Use components when results differ by party, respondent, claim, ground,
            conviction, sentence or cross-appeal.
          - Preserve remittal instructions, writs, decrees, retrial orders, release,'''
          new_outcome = '''- components must exhaustively record every explicit result by party, respondent,
            claim, numbered ground, conviction, sentence or cross-appeal. Scan all holding
            spans, not only the first. If grounds 1, 2 and 3 are each resolved, return three
            components with separate exact evidence.
          - Preserve remittal instructions, writs, decrees, retrial orders, release,'''
          if old_outcome not in prompts:
              raise SystemExit('Outcome prompt anchor not found')
          prompts = prompts.replace(old_outcome, new_outcome, 1)

          review_anchor = '''- unsupported summaries or evidence quotes.

          Recommend approve only when critical identity, final disposition and core legal'''
          review_replacement = '''- unsupported summaries or evidence quotes;
          - whether a lower-court order contains cumulative limbs concerning different
            shares, parcels, parties or remedies. Do not call those limbs contradictory
            unless they impose incompatible orders on the same legal object;
          - whether facts.summary or proceduralHistory improperly contains this court's
            final outcome;
          - whether every expressly resolved numbered ground appears in outcome.components.

          Recommend approve only when critical identity, final disposition and core legal'''
          if review_anchor not in prompts:
              raise SystemExit('Review prompt anchor not found')
          prompts_path.write_text(prompts.replace(review_anchor, review_replacement, 1), encoding='utf-8')

          # ── Specialist reconciliation ──────────────────────────────────────
          agents_path = Path('src/nomologies-v2/agents.ts')
          agents = agents_path.read_text(encoding='utf-8')

          import_anchor = '''  CaseProcedureV2,
            JudgmentParagraphV2,'''
          import_replacement = '''  CaseProcedureV2,
            type EvidenceAnchorV2,
            type GroundOrIssueV2,
            type OutcomeComponentV2,
            JudgmentParagraphV2,'''
          if import_anchor not in agents:
              raise SystemExit('Agent type import anchor not found')
          agents = agents.replace(import_anchor, import_replacement, 1)

          insertion_anchor = '''export async function runSpecialistAgents(
          '''
          helpers = r'''const PRESENT_OUTCOME_RE = /(?:η|η παρούσα|το|ο)\s*(?:έφεση|αίτηση|προσφυγή|αναφορά|ένσταση)\s+(?:απορρίπ|επιτρέπ|γίνεται\s+δεκτ|έγινε\s+δεκτ|withdrawn|dismissed|allowed)/iu;

          function removeOutcomeClauses(value: string): string {
            const pieces = String(value || "")
              .split(/(?<=[.!;··])\s+|\s*[·;]\s*/u)
              .map((piece) => piece.trim())
              .filter(Boolean)
              .filter((piece) => !PRESENT_OUTCOME_RE.test(piece));
            return pieces.join(". ").replace(/\.{2,}/g, ".").trim();
          }

          function clearFieldFlags(flags: Set<string>, paths: string[]): void {
            for (const flag of [...flags]) {
              if (paths.some((path) => flag.startsWith(`${path}:`))) flags.delete(flag);
            }
          }

          function resultAnchorNumber(anchor: EvidenceAnchorV2): string {
            const match = anchor.quote.match(/λόγ(?:ος|οι)\s+(?:έφεσης\s+)?(\d{1,3})/iu);
            return match?.[1] || "";
          }

          function explicitGroundResultAnchors(procedure: CaseProcedureV2): EvidenceAnchorV2[] {
            return procedure.groundsOrIssues.evidence.filter((anchor) =>
              /λόγ(?:ος|οι)\s+(?:έφεσης\s+)?\d+/iu.test(anchor.quote) &&
              /(απορρίπ|δεν\s+ευσταθ|δεν\s+ευστατεί|γίνεται\s+δεκτ|έγινε\s+δεκτ|επιτρέπ|μερικώς)/iu.test(anchor.quote)
            );
          }

          function outcomeCodeForGround(result: GroundOrIssueV2["result"]): OutcomeComponentV2["result"] | "" {
            if (result === "failed") return "dismissed";
            if (result === "succeeded") return "allowed";
            if (result === "partly_succeeded") return "partly_allowed";
            return "";
          }

          function buildHoldingText(grounds: GroundOrIssueV2[]): string {
            const resolved = grounds.filter((ground) => outcomeCodeForGround(ground.result));
            if (!resolved.length) return "";
            return resolved.map((ground) => {
              const label = ground.number ? `Λόγος ${ground.number}` : (ground.title || "Ζήτημα");
              if (ground.result === "failed") return `${label}: απορρίφθηκε`;
              if (ground.result === "succeeded") return `${label}: έγινε δεκτός`;
              return `${label}: έγινε εν μέρει δεκτός`;
            }).join("· ") + ".";
          }

          function cumulativeLowerCourtDecision(procedure: CaseProcedureV2): CaseProcedureV2["lowerCourtDecision"] | null {
            if (procedure.lowerCourtDecision.status !== "conflicted") return null;
            const orderEvidence = procedure.lowerCourtDecision.evidence.filter((anchor) =>
              /(διατάχ|ακύρω|μεταβίβ|εγγραφ|επιδικά)/iu.test(anchor.quote)
            );
            if (orderEvidence.length < 2) return null;
            const kinds = new Set<string>();
            for (const anchor of orderEvidence) {
              if (/ακύρω/iu.test(anchor.quote)) kinds.add("cancellation");
              if (/μεταβίβ/iu.test(anchor.quote)) kinds.add("transfer");
              if (/εγγραφ/iu.test(anchor.quote)) kinds.add("registration");
              if (/επιδικά/iu.test(anchor.quote)) kinds.add("award");
            }
            if (kinds.size < 2) return null;
            const value = `Το πρωτόδικο Δικαστήριο εξέδωσε σωρευτικά τις ακόλουθες διαταγές: ${orderEvidence.map((anchor, index) => `(${index + 1}) ${anchor.quote}`).join(" ")}`;
            return {
              status: "available",
              value,
              confidence: Math.max(0.9, procedure.lowerCourtDecision.confidence),
              evidence: orderEvidence,
              conflicts: [],
            };
          }

          function reconcileSpecialistFields(input: {
            facts: CaseFactsV2;
            procedure: CaseProcedureV2;
            analysis: CaseAnalysisV2;
            outcome: CaseOutcomeV2;
            flags: Set<string>;
          }): void {
            const { facts, procedure, analysis, outcome, flags } = input;

            if (facts.summary.status === "available") {
              const cleaned = removeOutcomeClauses(facts.summary.value);
              const evidence = facts.summary.evidence.filter((anchor) => anchor.sectionType !== "disposition" && anchor.sectionType !== "remedy" && anchor.sectionType !== "costs");
              if (cleaned && evidence.length) {
                facts.summary = { ...facts.summary, value: cleaned, evidence };
                clearFieldFlags(flags, ["facts.summary"]);
              }
            }

            if (procedure.proceduralHistory.status === "available") {
              const cleaned = removeOutcomeClauses(procedure.proceduralHistory.value);
              const evidence = procedure.proceduralHistory.evidence.filter((anchor) => anchor.sectionType !== "disposition" && anchor.sectionType !== "remedy" && anchor.sectionType !== "costs");
              if (cleaned && evidence.length) {
                procedure.proceduralHistory = { ...procedure.proceduralHistory, value: cleaned, evidence };
                clearFieldFlags(flags, ["procedure.proceduralHistory"]);
              }
            }

            const lowerCourt = cumulativeLowerCourtDecision(procedure);
            if (lowerCourt) {
              procedure.lowerCourtDecision = lowerCourt;
              clearFieldFlags(flags, ["procedure.lowerCourtDecision"]);
            }

            const explicitAnchors = explicitGroundResultAnchors(procedure);
            const grounds = procedure.groundsOrIssues.status === "available" ? procedure.groundsOrIssues.value : [];
            if (grounds.length && explicitAnchors.length) {
              const holdingText = buildHoldingText(grounds);
              if (holdingText) {
                analysis.holding = {
                  status: "available",
                  value: holdingText,
                  confidence: 0.98,
                  evidence: explicitAnchors,
                  conflicts: [],
                };
                clearFieldFlags(flags, ["analysis.holding"]);
              }

              const existing = new Map(outcome.components.status === "available"
                ? outcome.components.value.map((component) => [component.groundOrIssue.toLocaleLowerCase("el"), component])
                : []);
              const components: OutcomeComponentV2[] = outcome.components.status === "available" ? [...outcome.components.value] : [];
              const componentEvidence = outcome.components.status === "available" ? [...outcome.components.evidence] : [];
              for (const ground of grounds) {
                const result = outcomeCodeForGround(ground.result);
                if (!result || !ground.number) continue;
                const key = `λόγος έφεσης ${ground.number}`.toLocaleLowerCase("el");
                if (existing.has(key)) continue;
                const anchor = explicitAnchors.find((item) => resultAnchorNumber(item) === ground.number);
                if (!anchor) continue;
                const component: OutcomeComponentV2 = {
                  target: `Λόγος έφεσης ${ground.number}`,
                  groundOrIssue: `λόγος έφεσης ${ground.number}`,
                  result,
                  remedy: "",
                  orderText: anchor.quote,
                };
                components.push(component);
                componentEvidence.push(anchor);
                existing.set(key, component);
              }
              if (components.length) {
                outcome.components = {
                  status: "available",
                  value: components.sort((left, right) => left.target.localeCompare(right.target, "el", { numeric: true })),
                  confidence: Math.max(0.97, outcome.components.confidence),
                  evidence: [...new Map(componentEvidence.map((anchor) => [`${anchor.paragraphIds.join(",")}|${anchor.quote}`, anchor])).values()],
                  conflicts: [],
                };
                clearFieldFlags(flags, ["outcome.components"]);
              }
            }

            const dominantNeedsRepair = analysis.dominantIssue.status !== "available" ||
              [...flags].some((flag) => flag.startsWith("analysis.dominantIssue:"));
            if (dominantNeedsRepair && analysis.legalIssues.status === "available" && analysis.legalIssues.value.length) {
              const primary = analysis.legalIssues.value.find((issue) => issue.centrality === "primary") || analysis.legalIssues.value[0];
              const evidence = analysis.legalIssues.evidence.filter((anchor) => anchor.sectionType !== "disposition");
              if (primary?.issue && evidence.length) {
                analysis.dominantIssue = {
                  status: "available",
                  value: primary.issue,
                  confidence: 0.96,
                  evidence,
                  conflicts: [],
                };
                clearFieldFlags(flags, ["analysis.dominantIssue"]);
              }
            }
          }

          '''
          if insertion_anchor not in agents:
              raise SystemExit('runSpecialistAgents anchor not found')
          agents = agents.replace(insertion_anchor, helpers + insertion_anchor, 1)

          validation_block = '''  const authorities = validatedAuthorities(authorityResponse.data, context, flags);
            const outcome = validatedOutcome(outcomeResponse.data, context, flags);

            return {'''
          validation_replacement = '''  const authorities = validatedAuthorities(authorityResponse.data, context, flags);
            const outcome = validatedOutcome(outcomeResponse.data, context, flags);

            reconcileSpecialistFields({
              facts: factsProcedure.facts,
              procedure: factsProcedure.procedure,
              analysis,
              outcome,
              flags,
            });

            return {'''
          if validation_block not in agents:
              raise SystemExit('Specialist validation return anchor not found')
          agents_path.write_text(agents.replace(validation_block, validation_replacement, 1), encoding='utf-8')

          # ── Reviewer filtering and score semantics ─────────────────────────
          pipeline_path = Path('src/nomologies-v2/pipeline.ts')
          pipeline = pipeline_path.read_text(encoding='utf-8')

          old_reviewer_signature = '''function reviewerConflicts(
            payload: JsonRecord,
            allEvidenceIds: Set<string>,
          ): PipelineConflictV2[] {'''
          new_reviewer_signature = '''function reviewerConflicts(
            payload: JsonRecord,
            allEvidenceIds: Set<string>,
            results: SpecialistResultsV2,
          ): PipelineConflictV2[] {'''
          if old_reviewer_signature not in pipeline:
              raise SystemExit('Reviewer conflict signature not found')
          pipeline = pipeline.replace(old_reviewer_signature, new_reviewer_signature, 1)

          old_reviewer_body = '''    if (!isRecord(raw)) return [];
              const severity = str(raw.severity);
              if (!["critical", "material", "minor"].includes(severity)) return [];
              return [{'''
          new_reviewer_body = '''    if (!isRecord(raw)) return [];
              const code = str(raw.code) || "REVIEWER_CONFLICT";
              const fieldPath = str(raw.fieldPath);
              if (code === "HOLDING_NOT_POPULATED" && fieldAvailable(results.analysis.holding)) return [];
              if (code === "MISSING_COMPONENT_OUTCOMES" && fieldAvailable(results.outcome.components) &&
                fieldAvailable(results.procedure.groundsOrIssues)) {
                const resolved = results.procedure.groundsOrIssues.value.filter((ground) =>
                  ["succeeded", "failed", "partly_succeeded"].includes(ground.result)
                );
                if (results.outcome.components.value.length >= resolved.length) return [];
              }
              if (code === "SECTION_CROSSCONTAMINATION_OUTCOME_IN_FACTS" &&
                fieldAvailable(results.facts.summary) &&
                !/(?:έφεση|αίτηση|προσφυγή)\s+(?:απορρίπ|επιτρέπ|γίνεται\s+δεκτ)/iu.test(results.facts.summary.value)) return [];
              if (code === "LOWER_COURT_ORDER_CONFLICT" && results.procedure.lowerCourtDecision.status === "available") return [];
              const severity = str(raw.severity);
              if (!["critical", "material", "minor"].includes(severity)) return [];
              return [{'''
          if old_reviewer_body not in pipeline:
              raise SystemExit('Reviewer conflict body anchor not found')
          pipeline = pipeline.replace(old_reviewer_body, new_reviewer_body, 1)
          pipeline = pipeline.replace('code: str(raw.code) || "REVIEWER_CONFLICT",', 'code,', 1)
          pipeline = pipeline.replace('fieldPath: str(raw.fieldPath),', 'fieldPath,', 1)

          old_procedure_score = '''  const procedureFields = [results.procedure.proceduralHistory, results.procedure.groundsOrIssues, results.procedure.reliefSought];'''
          new_procedure_score = '''  const procedureFields = [
              results.procedure.proceduralHistory,
              results.procedure.originatingProceeding,
              results.procedure.lowerCourtDecision,
              results.procedure.groundsOrIssues,
            ];'''
          if old_procedure_score not in pipeline:
              raise SystemExit('Procedure score anchor not found')
          pipeline = pipeline.replace(old_procedure_score, new_procedure_score, 1)

          old_conflicts = '''  const conflicts = [...deterministic, ...reviewerConflicts(review.payload, evidenceIds)];'''
          new_conflicts = '''  const conflictMap = new Map<string, PipelineConflictV2>();
            for (const conflict of [...deterministic, ...reviewerConflicts(review.payload, evidenceIds, specialists)]) {
              const key = `${conflict.code}|${conflict.fieldPath}|${conflict.message}`;
              if (!conflictMap.has(key)) conflictMap.set(key, conflict);
            }
            const conflicts = [...conflictMap.values()];'''
          if old_conflicts not in pipeline:
              raise SystemExit('Conflict merge anchor not found')
          pipeline_path.write_text(pipeline.replace(old_conflicts, new_conflicts, 1), encoding='utf-8')
          PY

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check reconciled pipeline
        run: deno check scripts/run-test.ts

      - name: Commit reconciliation
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/reconcile-specialist-fields.yml
          git config user.name "Nomologies V2 Reconciliation Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/nomologies-v2/evidence.ts src/nomologies-v2/prompts.ts src/nomologies-v2/agents.ts src/nomologies-v2/pipeline.ts .github/workflows/reconcile-specialist-fields.yml
          git commit -m "Reconcile specialist extraction fields"
          git push origin HEAD:main
