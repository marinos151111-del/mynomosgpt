name: Refine atomic legal attribution

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/refine-atomic-attribution.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Preserve citations and split mixed owner passages
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source_path = Path('src/nomologies-v2/source.ts')
          source = source_path.read_text(encoding='utf-8')
          source = source.replace('const ATOMIC_SEGMENT_THRESHOLD = 360;', 'const ATOMIC_SEGMENT_THRESHOLD = 180;', 1)

          old_merge = '''  const merged: string[] = [];
            for (const segment of segments) {
              const startsLowercase = /^[«“"'(\\[]*[a-zα-ωάέήίόύώϊΐϋΰ]/u.test(segment);
              const previous = merged[merged.length - 1] || "";
              const previousEndsWithAbbreviation = /(?:\\b(?:v|vs|ν|αρ|ημερ|σελ|Δ|ΔΔ|Ltd|Co)\\.|(?:[A-ZΑ-Ω]\\.){2,})$/u.test(previous);
              if (merged.length && (startsLowercase || previousEndsWithAbbreviation)) {
                merged[merged.length - 1] = `${previous} ${segment}`.trim();
              } else {
                merged.push(segment);
              }
            }
            return merged.flatMap(splitLongBlock).filter(Boolean);'''

          new_merge = '''  const merged: string[] = [];
            for (const segment of segments) {
              const startsLowercase = /^[«“"'(\\[]*[a-zα-ωάέήίόύώϊΐϋΰ]/u.test(segment);
              const previous = merged[merged.length - 1] || "";
              const openParentheses = (previous.match(/\\(/g) || []).length > (previous.match(/\\)/g) || []).length;
              const openGreekQuote = (previous.match(/«/g) || []).length > (previous.match(/»/g) || []).length;
              const openCurlyQuote = (previous.match(/“/g) || []).length > (previous.match(/”/g) || []).length;
              const previousEndsWithAbbreviation = /(?:\\(?βλ|πρβλ|κ\\.ά|κ\\.α|ν|v|vs|αρ|ημερ|σελ|Δ|ΔΔ|Ltd|Co|Insur)\\.\\s*$/iu.test(previous) || /(?:[A-ZΑ-Ω]\\.){2,}\\s*$/u.test(previous);
              const shortCitationContinuation = segment.length <= 180 && /^(?:[A-ZΑ-Ω][\\p{L}'’.-]+|\\(?\\d{4}\\)|\\d+\\([A-ZΑ-Ω]\\)|C\\.L\\.R\\.|Α\\.Α\\.Δ\\.)/u.test(segment);
              const continuePrevious = startsLowercase || openParentheses || openGreekQuote || openCurlyQuote || previousEndsWithAbbreviation ||
                (shortCitationContinuation && /(?:\\b(?:ν|v|vs)\\.|\\(βλ\\.|,\\s*)/iu.test(previous));
              if (merged.length && continuePrevious) {
                merged[merged.length - 1] = `${previous} ${segment}`.trim();
              } else {
                merged.push(segment);
              }
            }
            return merged.flatMap(splitLongBlock).filter(Boolean);'''

          if old_merge not in source:
              raise SystemExit('Atomic merge block not found')
          source_path.write_text(source.replace(old_merge, new_merge, 1), encoding='utf-8')

          prompts_path = Path('src/nomologies-v2/prompts.ts')
          prompts = prompts_path.read_text(encoding='utf-8')
          anchor = '''- quoted_authority: text or a proposition attributed to another judgment. Use
            speakerRole=quoted_court and quotedSourceType=case.'''
          replacement = '''- quoted_authority: a substantial quotation or proposition expressly attributed
            to another judgment. Use speakerRole=quoted_court and quotedSourceType=case.
          - A rule stated in the present court's own voice does NOT become quoted_authority
            merely because it ends with a parenthetical citation, «βλ.» or a list of cases;
            classify it as legal_framework, court_analysis, legal_findings or ratio_decidendi
            according to its function.'''
          if anchor not in prompts:
              raise SystemExit('Quoted-authority prompt anchor not found')
          prompts_path.write_text(prompts.replace(anchor, replacement, 1), encoding='utf-8')

          agents_path = Path('src/nomologies-v2/agents.ts')
          agents = agents_path.read_text(encoding='utf-8')
          old_analysis_types = '''const ANALYSIS_TYPES = new Set<SectionType>([
            "facts", "court_analysis", "findings_of_fact", "legal_findings", "holding",'''
          new_analysis_types = '''const ANALYSIS_TYPES = new Set<SectionType>([
            "facts", "legal_framework", "court_analysis", "findings_of_fact", "legal_findings", "holding",'''
          if old_analysis_types not in agents:
              raise SystemExit('Analysis section set anchor not found')
          agents_path.write_text(agents.replace(old_analysis_types, new_analysis_types, 1), encoding='utf-8')

          evidence_path = Path('src/nomologies-v2/evidence.ts')
          evidence = evidence_path.read_text(encoding='utf-8')
          old_policy = '''const ANALYSIS_SECTIONS = new Set<SectionType>([
            "court_analysis", "findings_of_fact", "legal_findings", "holding",'''
          new_policy = '''const ANALYSIS_SECTIONS = new Set<SectionType>([
            "legal_framework", "court_analysis", "findings_of_fact", "legal_findings", "holding",'''
          if old_policy not in evidence:
              raise SystemExit('Analysis evidence policy anchor not found')
          evidence_path.write_text(evidence.replace(old_policy, new_policy, 1), encoding='utf-8')
          PY

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check refined pipeline
        run: deno check scripts/run-test.ts

      - name: Commit attribution refinement
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/refine-atomic-attribution.yml
          git config user.name "Nomologies V2 Attribution Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/nomologies-v2/source.ts src/nomologies-v2/prompts.ts src/nomologies-v2/agents.ts src/nomologies-v2/evidence.ts .github/workflows/refine-atomic-attribution.yml
          git commit -m "Refine atomic legal attribution"
          git push origin HEAD:main
